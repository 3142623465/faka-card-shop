# Render 一键部署配置
# 在 Render 创建 Web Service 时，选 "Public Git repository" 填入你的仓库地址，
# Render 会自动读取本文件配置。
services:
  - type: web
    name: faka-card-shop
    runtime: node
    repo: https://github.com/你的用户名/你的仓库名.git  # 替换成你的仓库
    branch: main
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false  # 需要在 Render 后台手动填写你的 MongoDB 连接字符串
